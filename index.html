<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio OS | Pavan's Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .tool-card { transition: all 0.2s ease; }
        .tool-card:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass sticky top-0 z-40 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-lg font-bold shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-bolt text-white"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold text-white">Creator Studio OS</h1>
                        <span id="toolCountBadge" class="text-[11px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-medium">Ready</span>
                    </div>
                    <p id="repoStatus" class="text-xs text-slate-400">pavan8224 / my-creator-tools</p>
                </div>
            </div>

            <!-- Search & Refresh -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Search tools..." 
                        class="w-full bg-slate-900/90 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="syncFromGitHub()" title="Sync New Tools" class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-1.5 transition">
                    <i id="refreshIcon" class="fa-solid fa-arrows-rotate"></i> Sync
                </button>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- Filter Tabs -->
        <div class="flex flex-wrap items-center gap-2 mb-6">
            <button onclick="setFilter('all', this)" class="tab-btn bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium transition">All Tools</button>
            <button onclick="setFilter('folder', this)" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-lg text-xs font-medium transition">
                <i class="fa-solid fa-folder-open mr-1 text-amber-400"></i> Folders
            </button>
            <button onclick="setFilter('file', this)" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-lg text-xs font-medium transition">
                <i class="fa-solid fa-code mr-1 text-emerald-400"></i> HTML Tools
            </button>
        </div>

        <!-- Tools Grid (Loads Immediately!) -->
        <div id="toolsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    </main>

    <!-- In-App Fullscreen Tool Runner -->
    <div id="appRunnerModal" class="fixed inset-0 bg-slate-950 z-50 hidden flex-col">
        <div class="h-12 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <button onclick="closeAppRunner()" class="px-3 py-1.5 rounded-md bg-slate-800 hover:bg-rose-600 text-white text-xs font-medium transition flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
                <span id="runningAppTitle" class="text-xs sm:text-sm font-semibold text-white truncate">Tool</span>
            </div>
            <a id="externalAppLink" href="#" target="_blank" class="px-3 py-1.5 rounded-md bg-blue-600 text-white text-xs font-medium shrink-0">
                New Tab <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
            </a>
        </div>
        <iframe id="appIframe" class="w-full flex-1 bg-white border-0"></iframe>
    </div>

    <script>
        const GITHUB_OWNER = 'pavan8224';
        const GITHUB_REPO = 'my-creator-tools';
        let currentFilter = 'all';

        // 1. Pre-Loaded Default Tools (Taaki 0 second mein bina ruke turant dikhe!)
        let discoveredTools = [
            makeToolItem('tools/PK POSTER STUDIO - AI-Powered Hindi Poster Designer.html', 'file'),
            makeToolItem('tools/pk_quotes_reels_studio_usa_edition (1).html', 'file'),
            makeToolItem('tools/pk_viral_suvichar_reels_studio_v7_0_true_2k_mp4.html', 'file'),
            makeToolItem('tools/New.html', 'file')
        ];

        function makeToolItem(rawPath, type) {
            const fileName = rawPath.split('/').pop();
            const cleanTitle = fileName
                .replace(/\.html$/i, '')
                .replace(/[-_]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            const lower = fileName.toLowerCase();
            let icon = 'fa-solid fa-wand-magic-sparkles';
            let color = 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20';
            let tag = type === 'folder' ? 'Folder App' : 'HTML Studio';

            if (lower.includes('poster') || lower.includes('banner')) {
                icon = 'fa-solid fa-palette';
                color = 'text-amber-400 bg-amber-500/10 border-amber-500/20';
                tag = 'Poster Designer';
            } else if (lower.includes('reel') || lower.includes('mp4') || lower.includes('video')) {
                icon = 'fa-solid fa-clapperboard';
                color = 'text-rose-400 bg-rose-500/10 border-rose-500/20';
                tag = 'Reels & Video Studio';
            } else if (lower.includes('quote') || lower.includes('suvichar')) {
                icon = 'fa-solid fa-quote-left';
                color = 'text-purple-400 bg-purple-500/10 border-purple-500/20';
                tag = 'Quotes Studio';
            } else if (type === 'folder') {
                icon = 'fa-solid fa-folder-open';
                color = 'text-blue-400 bg-blue-500/10 border-blue-500/20';
            }

            const encodedUrl = './' + rawPath.split('/').map(p => encodeURIComponent(p)).join('/') + (type === 'folder' ? '/' : '');

            return {
                id: rawPath,
                title: cleanTitle,
                rawPath: rawPath,
                type: type,
                url: encodedUrl,
                githubUrl: `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/blob/main/${rawPath.split('/').map(p => encodeURIComponent(p)).join('/')}`,
                icon, color, tag
            };
        }

        // 2. Render Cards on Screen
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = discoveredTools.filter(t => {
                const matchSearch = t.title.toLowerCase().includes(query) || t.rawPath.toLowerCase().includes(query);
                if (!matchSearch) return false;
                if (currentFilter === 'folder') return t.type === 'folder';
                if (currentFilter === 'file') return t.type === 'file';
                return true;
            });

            document.getElementById('toolCountBadge').innerText = `${discoveredTools.length} Tools Active`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">Koi matching tool nahi mila.</div>`;
                return;
            }

            filtered.forEach(tool => {
                const card = document.createElement('div');
                card.className = "tool-card glass rounded-2xl p-5 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div class="w-11 h-11 rounded-xl border ${tool.color} flex items-center justify-center text-lg">
                                <i class="${tool.icon}"></i>
                            </div>
                            <span class="text-[11px] bg-slate-800 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-md font-medium">
                                ${tool.tag}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-white mb-1 break-words">${tool.title}</h3>
                        <p class="text-[11px] text-slate-400 font-mono break-all mb-4">/${tool.rawPath}</p>
                    </div>

                    <div class="pt-3 border-t border-slate-800 flex items-center gap-2">
                        <button class="run-btn flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 px-3 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-play text-[10px]"></i> Open Here
                        </button>
                        <a href="${tool.url}" target="_blank" class="p-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs transition" title="Open in New Tab">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
                card.querySelector('.run-btn').addEventListener('click', () => launchInApp(tool.url, tool.title));
                grid.appendChild(card);
            });
        }

        // 3. Auto-Discovery from GitHub (Single Fast Tree API Call)
        async function syncFromGitHub() {
            const refreshIcon = document.getElementById('refreshIcon');
            const statusText = document.getElementById('repoStatus');
            refreshIcon.classList.add('fa-spin');
            statusText.innerText = "Scanning GitHub for new tools...";

            try {
                // Fetch entire repository file tree in 1 single API call
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/main?recursive=1&t=${Date.now()}`);
                if (!res.ok) throw new Error(`API ${res.status}`);
                const data = await res.json();

                if (data && Array.isArray(data.tree)) {
                    const liveTools = [];
                    const foldersWithIndex = new Set();

                    // Check folders that have their own index.html
                    data.tree.forEach(item => {
                        if (item.path !== 'index.html' && item.path.toLowerCase().endsWith('/index.html')) {
                            const folderPath = item.path.replace(/\/index\.html$/i, '');
                            foldersWithIndex.add(folderPath);
                            liveTools.push(makeToolItem(folderPath, 'folder'));
                        }
                    });

                    // Check all standalone .html files (inside tools/ or root)
                    data.tree.forEach(item => {
                        const p = item.path;
                        const lower = p.toLowerCase();
                        if (item.type === 'blob' && lower.endsWith('.html') && p !== 'index.html' && p !== '404.html') {
                            const parentFolder = p.includes('/') ? p.substring(0, p.lastIndexOf('/')) : '';
                            if (!foldersWithIndex.has(parentFolder)) {
                                liveTools.push(makeToolItem(p, 'file'));
                            }
                        }
                    });

                    if (liveTools.length > 0) {
                        discoveredTools = liveTools;
                        renderTools();
                    }
                    statusText.innerText = `Live Synced • ${discoveredTools.length} Tools Found`;
                }
            } catch (e) {
                console.warn("Using Instant Cache:", e);
                statusText.innerText = `Instant Mode Active (${discoveredTools.length} Tools)`;
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        function setFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-lg text-xs font-medium transition";
            });
            btn.className = "tab-btn bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium transition";
            renderTools();
        }

        function launchInApp(url, title) {
            document.getElementById('runningAppTitle').innerText = title;
            document.getElementById('externalAppLink').href = url;
            document.getElementById('appIframe').src = url;
            const modal = document.getElementById('appRunnerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAppRunner() {
            const modal = document.getElementById('appRunnerModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('appIframe').src = 'about:blank';
        }

        document.getElementById('searchInput').addEventListener('input', renderTools);

        // Render immediately on open, then check GitHub for any new files!
        renderTools();
        syncFromGitHub();
    </script>
</body>
</html>
